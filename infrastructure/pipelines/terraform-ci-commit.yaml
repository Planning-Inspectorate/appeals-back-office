trigger: none

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - infrastructure

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.2

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    globalVariables:
      - template: azure-pipelines-variables.yml@self
    validationJobs:
      - name: Check Commits
        steps:
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                  npm | "$(Agent.OS)" | package-lock.json
              path: $(Pipeline.Workspace)/.npm
            displayName: Cache NPM
          - template: ../steps/node_script.yml
            parameters:
              nodeVersion: 22
              script: npm ci
              environmentVariables:
                npm_config_cache: $(Pipeline.Workspace)/.npm
          - template: ../steps/node_script.yml
            parameters:
              nodeVersion: 22
              displayName: Commitlint
              condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
              script: |
                set -e
                from=$(git rev-parse 'HEAD^1')
                to=$(git rev-parse 'HEAD^2')

                echo "Commitlint range:"
                git show -s --format='from: %H %s' "$from"
                git show -s --format='to:   %H %s' "$to"

                echo "Commits being linted (hash and subject):"
                git log --format='%H %s' "$from..$to"

                npx commitlint --from "$from" --to "$to"
