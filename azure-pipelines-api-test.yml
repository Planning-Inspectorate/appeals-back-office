parameters:
  - name: Environment
    type: string
    default: 'test'
    values:
      - 'dev'
      - 'test'

variables:
  - name: APP
    value: 'applications'
  - group: e2e-${{ parameters.Environment }}

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/e2e/cypress/e2e/back-office-applications
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

jobs:
  - job: Run_API_Tests
    pool: pins-odt-agent-pool-tests

    steps:
      - template: steps/node_script.yml@templates
        parameters:
          displayName: 'Install npm'
          nodeVersion: 22
          script: npm ci
          workingDirectory: 'apps/e2e'
          environmentVariables:
            npm_config_cache: $(npm_config_cache)

      - task: ShellScript@2
        inputs:
          scriptPath: 'apps/api-testing/api-test.sh'
        env:
          BASE_URL: $(API_BASE_URL)
        displayName: "Run API Tests"
